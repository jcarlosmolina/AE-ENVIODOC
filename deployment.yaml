apiVersion: apps/v1
kind: Deployment
metadata:
  name: ae-enviodoc
  labels:
    app: ae-enviodoc
    app.kubernetes.io/component: ae-enviodoc
    app.kubernetes.io/instance: ae-enviodoc
    app.kubernetes.io/name: ae-enviodoc
    app.kubernetes.io/part-of: ae-app
    app.openshift.io/runtime: ae-enviodoc
spec:
# Set the desired number of replicas
  replicas: 1
  selector:
    matchLabels:
      app: ae-enviodoc
  template:
    metadata:
      labels:
        app: ae-enviodoc
        deployment: ae-enviodoc
    spec:
      containers:
        - name: ae-enviodoc
# Replace the placeholder below with the name of your OpenShift namespace/project
#INIIMAGEN
          image: 'image-registry.openshift-image-registry.svc:5000/soporte-colsanitas-dev/ae-enviodoc:latest'
#FINIMAGEN
# Path del volumen temporal para guardar los reportes y el fichero zip
# IMPORTANTE: El valor de la clave "mountPath" debe asignarse en el fichero 
#             application.properties a la variable com.keralty.enviodoc.path-temporal 
          volumeMounts:
          - name: temp-storage
            mountPath: /mnt/temp-storage # Mount path in the container
          ports:
            - containerPort: 8101
              protocol: TCP
          env:
# Replace the TZ env variable with your desired timezone. For a list of valid timezones see https://www.iana.org/time-zones
          - name: TZ
            value: 'America/Bogota'
          - name: quarkus.datasource.jdbc.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-database-jdbc-url
          - name: quarkus.datasource.username
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: db-username
          - name: quarkus.datasource.password
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: db-password
          - name: quarkus.rest-client.ae-apigateway.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-apigateway-url
          - name: quarkus.rest-client.ae-usuarios.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-usuarios-url
          - name: quarkus.rest-client.ae-configuraciones.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-configuraciones-url
          - name: quarkus.rest-client.ae-reportes.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-reportes-url
          - name: quarkus.rest-client.ae-firmas.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-firmas-url
          - name: quarkus.rest-client.ae-personas.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-personas-url
          - name: quarkus.rest-client.ae-solicitudes.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-solicitudes-url
          - name: quarkus.rest-client.ae-novedades.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-novedades-url
          - name: quarkus.rest-client.ae-generasolicitud.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-generasolicitud-url
          - name: quarkus.rest-client.ae-enviodoc.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-enviodoc-url
          - name: quarkus.rest-client.ae-reportsgenerator.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-reportsgenerator-url
# Set the values below according to your preferences to assign resources to this microservice
          resources:
            limits:
              cpu: 400m
              memory: 400Mi
            requests:
              cpu: 10m
              memory: 200Mi
      volumes:
      - name: temp-storage
        emptyDir: {} # This sets up an emptyDir volume

