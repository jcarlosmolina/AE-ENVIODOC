apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ae-enviodoc
  labels:
    app: ae-enviodoc
    app.kubernetes.io/component: ae-enviodoc
    app.kubernetes.io/instance: ae-enviodoc
    app.kubernetes.io/name: ae-enviodoc
    app.kubernetes.io/part-of: ae-app
    app.openshift.io/runtime: ae-enviodoc
spec:
  source:
    type: Git
    git:
# Replace the placeholder below with the name of your GitHub username
      uri: "git@github.com:${GitHubUserName}/ae-enviodoc.git"
# Uncomment and adapt the line below if you need to reference a specific branch in the repository above
#      ref: "main"
# Uncomment and adapt the two lines below if you need to use credentials to access the (private) repository above
#    sourceSecret:
#      name: ae-enviodoc-git-credentials
  strategy:
    type: Docker
  output:
    to:
      kind: ImageStreamTag
      name: ae-enviodoc:latest
